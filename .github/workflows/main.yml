name: SX Bet Auto-Bettor (Webshare Proxy)

on:
  workflow_dispatch: # تشغيل يدوي في أي وقت
  schedule:
    - cron: '0 */5 * * *' # صمام أمان: إعادة تشغيل كل 5 ساعات لضمان الاستمرارية للأبد
  push:
    branches: [ main ]

concurrency:
  group: sx-bet-daemon
  cancel-in-progress: true # إلغاء الدورة السابقة لتشغيل دورة واحدة فقط دائماً بدون تكرار

permissions:
  actions: write
  contents: write

jobs:
  auto-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # يعمل لمدة 5 ساعات و 40 دقيقة (قبل حد جيتهاب الأقصى 6 ساعات)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Auto-Bet Daemon
        env:
          sx_bet_API: ${{ secrets.SX_BET_API || secrets.sx_bet_API }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          echo "=== Running SX Bet Bot Daemon (Unbuffered Live Stream) ==="
          stdbuf -oL -eL node auto-bet.mjs

      - name: Self-Trigger Next Run (24/7 Forever Loop)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Dispatching next 24/7 workflow run ==="
          gh workflow run auto-bet.yml --ref ${{ github.ref_name }} || true
